services:
  agent-memory:
    build: .
    container_name: agent-memory
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - agent-memory-data:/data
      - ./config.toml:/app/config.toml:ro
    environment:
      - AGENT_MEMORY_ADMIN_TOKEN=${AGENT_MEMORY_ADMIN_TOKEN:?}

volumes:
  agent-memory-data:
