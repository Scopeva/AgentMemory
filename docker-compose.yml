services:
  agent-memory:
    build: .
    # or: image: scopeva/agent-memory:latest
    container_name: agent-memory
    ports:
      # Host agents reach the service on localhost only.
      - "127.0.0.1:8765:8765"
    environment:
      AGENT_MEMORY_ADMIN_TOKEN: ${AGENT_MEMORY_ADMIN_TOKEN:?set an admin token}
    # Linux needs this for host.docker.internal resolution
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - memory-data:/data
      - ./config.toml:/app/config.toml:ro

volumes:
  memory-data:
