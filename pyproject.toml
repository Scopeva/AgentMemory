[project]
name = "agent-memory"
version = "0.1.0"
description = "Local Agent Memory & Handoff Service for coding agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typer>=0.12.0",
    # Runtime: retrieval/embedding layer imports httpx at module load.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
embedding = [
    "httpx>=0.27.0",
]
cli = [
    "typer>=0.12.0",
]

# ---------------------------------------------------------------------------
# sqlite-vec: loadable C extension for vector similarity search.
#
# Not a pip-installable Python package; it ships as a native shared object
# (vec0.so / vec0.dylib). The retrieval layer probes for it at startup via
# ``agent_memory.retrieval.sqlvec`` and degrades to lexical-only if absent.
#
# To enable hybrid vector search:
#   1. Download a prebuilt .so / .dylib from
#      https://github.com/ashtum/sqlite-vec/releases
#   2. Drop it into a directory (e.g. /usr/local/lib/sqlite-vec/vec0.so)
#   3. Set the environment variable:
#        export SQLITE_VEC_PATH=/usr/local/lib/sqlite-vec/vec0.so
#   4. Restart the service.
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
